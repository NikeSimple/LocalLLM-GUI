name: Build and Test

on:
  push:
    branches: [ main, master, feature/sqlite-storage ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libsqlite3-dev \
            cmake \
            g++

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
